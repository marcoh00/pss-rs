[package]
name = "pss-rs-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
dh = ["pss-rs/dh"]

[dependencies]
pss-rs = { path = "../pss-rs", features = ["wasm"] }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
