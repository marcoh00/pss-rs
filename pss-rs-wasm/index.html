<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <p></p>
    </body>
    <script type="module">
        import { default as init, Algorithm, JsGroupManagerPrivateKey } from "./pkg/pss_rs_wasm.js";

        async function main() {
            const pssrs = await init();
            const alg = Algorithm.Secp256k1;
            const gm = new JsGroupManagerPrivateKey(alg);
            const gpk = gm.public_key(alg);
            const sector = gm.new_sector(alg, false);
            const icc = gm.new_icc(alg);
            const sig = icc.sign(alg, gpk, sector, true, true, [0, 1, 2]);
            console.log("gm, gpk, sector, icc, sig", gm, gpk, sector, icc, sig);
            console.log("Sig ok?", gpk.check_signature(alg, sector, sig, [0, 1, 2]));
        }
        main()

    </script>
</html>
