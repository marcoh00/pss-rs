[package]
name = "pss-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["wasm", "altbn"]
wasm = ["wasm-bindgen", "getrandom"]
dh = []
altbn = ["ark-bn254", "ark-std", "ark-ec", "ark-serialize", "ark-ff"]

[dependencies]
rand_core = "0.6"
crypto-bigint = "0.5"
elliptic-curve = { version = "0.13", features = ["arithmetic"] }
group = { version = "0.13", default-features = false }
k256 = { version = "0.13" }
sha3 = "0.10"

# Optional features
getrandom = { version = "0.2", features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
ark-std = { version = "0.5.0", optional = true }
ark-bn254 = { version = "0.5.0", optional = true }
ark-ec = { version = "0.5.0", optional = true }
ark-serialize = { version = "0.5.0", optional = true }
ark-ff = { version = "0.5.0", optional = true }