[package]
name = "pss-keygen"
version = "0.1.0"
edition = "2021"

[features]
default = ["altbn"]
dh = ["pss-rs/dh"]
altbn = ["pss-rs/altbn"]

[dependencies]
pss-rs = { path = "../pss-rs" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_core = "0.6"
